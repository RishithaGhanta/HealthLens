<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthLens | Analysis Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page-shell result-page">
        <section class="hero-section">
            <p class="eyebrow">AI Health Literacy Prototype</p>
            <h1>HealthLens Analysis</h1>
            <p class="hero-subtitle">Educational analysis generated for the submitted health claim.</p>

            <!-- Analysis card displays formatted HTML response -->
            <section class="analysis-card">
                <div class="analysis-content">
                    <!-- Safely render the HTML-converted Markdown response -->
                    {{ analysis | safe }}
                </div>
            </section>

            <!-- Navigation back to homepage -->
            <div class="result-actions">
                <a href="{{ url_for('home') }}">
                    <button class="primary-button">Analyze Another Claim</button>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
